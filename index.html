<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 用 %BASE_URL% 而不是写死 /favicon.svg：打包后会自动变成 /sth-for-dad/favicon.svg -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- viewport-fit=cover 让内容能铺到刘海屏/手势条区域，配合 CSS 的 env(safe-area-inset-*) 使用 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 安卓 Chrome 地址栏/PWA 状态栏配色 -->
    <meta name="theme-color" content="#242424" />
    <!-- iOS 加到主屏后全屏运行（安卓靠下面的 PWA manifest） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>sth-for-dad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
